services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: streamline-iptv:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      LEAD_WEBHOOK_URL: ${LEAD_WEBHOOK_URL:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-hello@example.com}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
